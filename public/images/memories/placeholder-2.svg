<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="sky2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C1030"/>
      <stop offset="40%" stop-color="#2D1A4A"/>
      <stop offset="70%" stop-color="#4A2060"/>
      <stop offset="100%" stop-color="#1A0E30"/>
    </linearGradient>
    <linearGradient id="moonGlow2" cx="50%" cy="50%" r="50%" fx="50%" fy="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFF8F0" stop-opacity="1"/>
      <stop offset="60%" stop-color="#FFE8D6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8C4D8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moonGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="50%" stop-color="#FFE8D6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8C4D8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softblur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Deep twilight sky background -->
  <rect width="1000" height="700" fill="url(#sky2)"/>

  <!-- Stars -->
  <circle cx="120" cy="60" r="1.5" fill="#FFF8F0" opacity="0.8"/>
  <circle cx="240" cy="35" r="1" fill="#FFF8F0" opacity="0.6"/>
  <circle cx="380" cy="80" r="1.5" fill="#FFF8F0" opacity="0.7"/>
  <circle cx="620" cy="45" r="1" fill="#EAB7D0" opacity="0.9"/>
  <circle cx="780" cy="70" r="1.5" fill="#FFF8F0" opacity="0.6"/>
  <circle cx="900" cy="40" r="1" fill="#FFF8F0" opacity="0.8"/>
  <circle cx="50" cy="120" r="1" fill="#FFF8F0" opacity="0.5"/>
  <circle cx="450" cy="30" r="1" fill="#EAB7D0" opacity="0.7"/>
  <circle cx="700" cy="90" r="1.5" fill="#FFF8F0" opacity="0.5"/>
  <circle cx="850" cy="110" r="1" fill="#FFF8F0" opacity="0.6"/>
  <circle cx="160" cy="140" r="1" fill="#EAB7D0" opacity="0.5"/>
  <circle cx="560" cy="55" r="1.5" fill="#FFF8F0" opacity="0.7"/>

  <!-- Moon glow halo -->
  <circle cx="740" cy="155" r="120" fill="#E8B4CC" opacity="0.12" filter="url(#softblur)"/>
  <circle cx="740" cy="155" r="80" fill="#F4D0E0" opacity="0.18" filter="url(#softblur)"/>
  <!-- Moon itself -->
  <circle cx="740" cy="155" r="58" fill="#FFF9F2" opacity="0.95"/>
  <circle cx="740" cy="155" r="55" fill="#FFF4EA" opacity="0.8"/>

  <!-- Mountain silhouettes - purple/mauve, NOT black -->
  <path d="M-50,700 L150,360 L350,700Z" fill="#3A2558" opacity="0.92"/>
  <path d="M200,700 L460,280 L720,700Z" fill="#2E1C48" opacity="0.9"/>
  <path d="M550,700 L780,340 L1050,700Z" fill="#3A2558" opacity="0.85"/>
  <path d="M750,700 L920,410 L1100,700Z" fill="#251538" opacity="0.88"/>
  <!-- Ground -->
  <path d="M0,620 Q250,580 500,600 Q750,620 1000,590 L1000,700 L0,700Z" fill="#1A0E2E" opacity="0.95"/>

  <!-- Sakura tree silhouette (left side) -->
  <!-- Trunk -->
  <rect x="108" y="340" width="18" height="200" rx="6" fill="#2D1A30" opacity="0.9" transform="rotate(-3, 117, 440)"/>
  <!-- Branches -->
  <line x1="117" y1="380" x2="60" y2="300" stroke="#2D1A30" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  <line x1="117" y1="360" x2="185" y2="290" stroke="#2D1A30" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <line x1="60" y1="300" x2="30" y2="240" stroke="#2D1A30" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <line x1="185" y1="290" x2="220" y2="230" stroke="#2D1A30" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <!-- Blossom clusters -->
  <circle cx="40" cy="215" r="42" fill="#F4B8D0" opacity="0.88"/>
  <circle cx="90" cy="195" r="38" fill="#EAA8C4" opacity="0.82"/>
  <circle cx="145" cy="200" r="35" fill="#F8CCD8" opacity="0.85"/>
  <circle cx="220" cy="210" r="40" fill="#F0A8C0" opacity="0.82"/>
  <circle cx="170" cy="175" r="30" fill="#FAD8E8" opacity="0.80"/>
  <circle cx="60" cy="250" r="28" fill="#F4B8D0" opacity="0.75"/>
  <circle cx="200" cy="255" r="25" fill="#EAA8C4" opacity="0.72"/>

  <!-- Falling petals -->
  <ellipse cx="300" cy="200" rx="6" ry="3" fill="#F6C4D8" opacity="0.85" transform="rotate(-25, 300, 200)"/>
  <ellipse cx="450" cy="150" rx="5" ry="2.5" fill="#EAB7D0" opacity="0.8" transform="rotate(15, 450, 150)"/>
  <ellipse cx="580" cy="280" rx="6" ry="3" fill="#F8D0E0" opacity="0.78" transform="rotate(-40, 580, 280)"/>
  <ellipse cx="700" cy="220" rx="5" ry="2.5" fill="#F4B8D0" opacity="0.82" transform="rotate(30, 700, 220)"/>
  <ellipse cx="820" cy="310" rx="6" ry="3" fill="#EAA8C4" opacity="0.75" transform="rotate(-20, 820, 310)"/>
  <ellipse cx="920" cy="180" rx="5" ry="2.5" fill="#F6C4D8" opacity="0.80" transform="rotate(45, 920, 180)"/>
  <ellipse cx="350" cy="400" rx="6" ry="3" fill="#EAB7D0" opacity="0.70" transform="rotate(-35, 350, 400)"/>
  <ellipse cx="650" cy="380" rx="5" ry="2.5" fill="#F8D0E0" opacity="0.72" transform="rotate(20, 650, 380)"/>

  <!-- Photo frame hint in center -->
  <rect x="350" y="220" width="300" height="360" rx="16" fill="#FFF8F1" opacity="0.08" stroke="#EAB7D0" stroke-width="1.5" stroke-dasharray="8,5" stroke-opacity="0.5"/>
  
  <!-- Centered text -->
  <text x="500" y="390" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#F6D9E6" opacity="0.85">Mansiii &amp; The Flower Bouquet</text>
  <text x="500" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#C9A0C8" opacity="0.7" letter-spacing="2">Add photo-2-bouquet.jpg to continue</text>

  <!-- Lantern glow right side -->
  <circle cx="870" cy="520" r="45" fill="#FFD494" opacity="0.15" filter="url(#softblur)"/>
  <rect x="855" y="490" width="30" height="30" rx="4" fill="#FFF4D0" opacity="0.60"/>
  <polygon points="840,490 900,490 875,470" fill="#3A2A48" opacity="0.85"/>
  <rect x="861" y="520" width="18" height="40" rx="3" fill="#30263F" opacity="0.85"/>
</svg>
